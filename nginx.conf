# nginx for Frode's Bike Trainer – serves the site over HTTPS on this computer's address (LAN),
# runs the PHP scripts through php-cgi and passes Party Spin's WebSocket on as wss://.
#
#   https://<this computer's IP>/                 the site (http:// is sent on to https://)
#   wss://<this computer's IP>/partyspin/ws        → the Party Spin server on 127.0.0.1:8765
#
# Before the first start
#   1. A certificate (self-signed, for development – browsers warn about it). certs/dev.crt and
#      certs/dev.key already exist for 10.0.0.3; if the address changes, make new ones in the project folder:
#        mkdir certs
#        openssl req -x509 -newkey rsa:2048 -nodes -days 825 -keyout certs/dev.key -out certs/dev.crt -subj "/CN=Frodes Bike Trainer (dev)" -addext "subjectAltName=IP:10.0.0.3,IP:127.0.0.1,DNS:localhost"
#      (put the computer's own LAN address after IP:, see ipconfig. certs/ is in .gitignore.)
#   2. PHP: extension=openssl on in php.ini (for e-mail), and site_url in server/config.php set to
#      https://<the IP>/.
#   3. The Windows firewall must let others on the LAN reach ports 80 and 443 (Windows asks
#      the first time nginx starts: allow "Private networks").
#
# Every time, three programs (each in its own terminal, PowerShell):
#   PHP:         $env:PHP_FCGI_MAX_REQUESTS = 0; php-cgi -b 127.0.0.1:9123
#   Party Spin:  cd applications/PartySpin/server; python partyspin_server.py --host 127.0.0.1
#                (127.0.0.1: only nginx reaches it, so everyone gets the encrypted wss://)
#   The simple way: start-server.bat starts all three (and finds nginx itself), stop-server.bat stops them.
#
#   By hand – nginx (from the project folder; -p = nginx's own folder, for its logs\ and temp\):
#     Start:   nginx -p "C:/Program Files/nginx-1.30.6/" -c "$PWD/nginx.conf"              (keeps the terminal)
#     Test:    nginx -p "C:/Program Files/nginx-1.30.6/" -c "$PWD/nginx.conf" -t
#     Reload:  nginx -p "C:/Program Files/nginx-1.30.6/" -c "$PWD/nginx.conf" -s reload    (after editing this file)
#     Stop:    nginx -p "C:/Program Files/nginx-1.30.6/" -c "$PWD/nginx.conf" -s quit      (-s stop = right away)
#     Stuck:   taskkill /f /im nginx.exe
#   ($PWD is PowerShell; in cmd.exe write %cd% instead.)
#
# Paths in here are absolute (nginx resolves relative ones from the folder of this file); logs and
# temporary files go in the nginx folder (logs\error.log, logs\access.log).
# The rules that keep files private are the same as the .htaccess files (for Apache) in the project.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # The file types the site uses (instead of including nginx's mime.types).
    types {
        text/html                 html htm;
        text/css                  css;
        text/javascript           js mjs;
        application/json          json map;
        text/plain                txt;
        text/markdown             md;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/gif                 gif;
        image/svg+xml             svg;
        image/webp                webp;
        image/x-icon              ico;
        font/woff                 woff;
        font/woff2                woff2;
        font/ttf                  ttf;
        font/otf                  otf;
        audio/mpeg                mp3;
        audio/wav                 wav;
        audio/ogg                 ogg;
        video/mp4                 mp4;
        video/webm                webm;
        model/gltf-binary         glb;
        model/gltf+json           gltf;
        application/wasm          wasm;
        application/pdf           pdf;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain text/javascript application/json text/markdown image/svg+xml;

    sendfile on;
    server_tokens off;              # don't tell the world the nginx version
    keepalive_timeout 65;
    client_max_body_size 2m;        # profile pictures are at most 512 kB

    gzip on;
    gzip_types text/css text/javascript application/json image/svg+xml text/plain;

    # WebSocket upgrade: "upgrade" when the browser asks for it, otherwise a normal connection.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # http:// → https://
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        server_name _;              # any address of this computer (LAN IP, localhost …)

        root  "C:/Users/jones/Documents/estilmk47/Frode-s-Bike-Trainer-Web-App";
        index index.html index.php;

        ssl_certificate     "C:/Users/jones/Documents/estilmk47/Frode-s-Bike-Trainer-Web-App/certs/dev.crt";
        ssl_certificate_key "C:/Users/jones/Documents/estilmk47/Frode-s-Bike-Trainer-Web-App/certs/dev.key";
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        # ---- Party Spin's game server: wss:// here, plain ws:// to the Python program ----
        location = /partyspin/ws {
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # A game can be quiet for a while; don't close the connection after nginx's default 60 s.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # ---- Never served (404, so nobody learns what exists) ----
        # Hidden files: .git, .htaccess, .gitignore … (.well-known stays open for a real certificate later)
        location ~ /\.(?!well-known/) { return 404; }
        # This file and the certificate
        location = /nginx.conf { return 404; }
        location ^~ /certs/ { return 404; }
        # The databases
        location ^~ /server/databases/ { return 404; }
        location ~* \.(sqlite|sqlite3|db|py|pyc|sql|bat|cmd|ps1)$ { return 404; }
        # Server configuration and helpers that are no pages of their own (as server/.htaccess)
        location ~ ^/server/(config(\.example)?\.php|database_link\.php|api_common\.php|mailer\.php|test_mail\.php|.*\.(txt|md))$ { return 404; }
        # Party Spin: the Python server's folder (incl. its config.php and venv), and the API's helpers
        location ^~ /applications/PartySpin/server/ { return 404; }
        location ~ ^/applications/PartySpin/api/(partyspin_common|authentication_keys(\.example)?)\.php$ { return 404; }
        # The old Party Spin, kept locally
        location ^~ "/applications/PartySpin [archive]/" { return 404; }
        # Uploaded profile pictures: only the PNG files, and nothing there is ever run as code
        location ^~ /assets/user_uploaded_profile_icons/ {
            location ~* \.png$ { try_files $uri =404; }
            return 404;
        }

        # ---- PHP (only files that exist; php-cgi listens on 127.0.0.1:9123) ----
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9123;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME   $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME       $fastcgi_script_name;
            fastcgi_param QUERY_STRING      $query_string;
            fastcgi_param REQUEST_METHOD    $request_method;
            fastcgi_param CONTENT_TYPE      $content_type;
            fastcgi_param CONTENT_LENGTH    $content_length;
            fastcgi_param REQUEST_URI       $request_uri;
            fastcgi_param DOCUMENT_URI      $document_uri;
            fastcgi_param DOCUMENT_ROOT     $document_root;
            fastcgi_param SERVER_PROTOCOL   $server_protocol;
            fastcgi_param REQUEST_SCHEME    $scheme;
            fastcgi_param HTTPS             on;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE   nginx;
            fastcgi_param REMOTE_ADDR       $remote_addr;
            fastcgi_param REMOTE_PORT       $remote_port;
            fastcgi_param SERVER_ADDR       $server_addr;
            fastcgi_param SERVER_PORT       $server_port;
            fastcgi_param SERVER_NAME       $host;
            fastcgi_param REDIRECT_STATUS   200;
            fastcgi_read_timeout 60s;
        }

        # ---- Everything else: the files as they are ----
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
